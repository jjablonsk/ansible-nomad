- name: Restart nomad on Unix
  ansible.builtin.service:
    name: nomad
    state: restarted
  when:
    - ansible_os_family != "Windows"
  listen: Restart nomad

- name: Restart nomad on Windows
  ansible.windows.win_service:
    name: nomad
    state: restarted
  become: false
  when:
    - ansible_os_family == "Windows"
  register: windows_service_started
  retries: 3
  delay: 1
  until: windows_service_started is succeeded
  listen: Restart nomad