# Gathers facts (bind address) from servers not currently targeted.
# 'delegate_facts' is currently rather buggy in Ansible so this might not
# always work. Hence 'nomad_gather_server_facts' defaults to 'no'.
- name: (Windows) Gather facts from other servers # noqa ignore-errors
  ansible.builtin.setup:
  delegate_to: "{{ item }}"
  delegate_facts: true
  with_items: "{{ nomad_servers | difference(ansible_play_hosts) }}"
  ignore_errors: true
  when: nomad_gather_server_facts | bool

- name: (Windows) Expose bind_address, advertise_address and node_role as facts
  ansible.builtin.set_fact:
    nomad_bind_address: "{{ nomad_bind_address }}"
    nomad_advertise_address: "{{ nomad_advertise_address }}"
    nomad_node_role: "{{ nomad_node_role }}"

- name: (Windows) Include directory settings
  ansible.builtin.import_tasks:
    file: dirs.yml

- name: (Windows) Check for existing Nomad binary
  ansible.windows.win_stat:
    path: "{{ nomad_binary }}"
  register: nomad_binary_installed

- name: (Windows) Get current Nomad version
  ansible.windows.win_command: "{{ nomad_binary }} --version"
  changed_when: false
  when:
    # - not consul_force_install
    - nomad_binary_installed.stat.exists
  register: nomad_installed_version

- name: (Windows) Calculate whether to install nomad binary
  ansible.builtin.set_fact:
    # nomad_install_binary: "{{ consul_force_install or not consul_binary_installed.stat.exists or consul_installed_version.stdout_lines[0] != _consul_expected_version_string }}"
    nomad_install_binary: "{{ not nomad_binary_installed.stat.exists or nomad_installed_version.stdout_lines[0] != _nomad_expected_version_string }}"

- name: (Windows) Install OS packages
  ansible.builtin.include_tasks:
    file: install_windows.yml
  when: nomad_install_binary | bool

- name: Convert nomad_data_dir from Unix -> Windows
  ansible.windows.win_stat:
    path: "{{ nomad_data_dir }}"
  register: nomad_data_dir_win

- name: Update fact with Windows path
  ansible.builtin.set_fact:
    nomad_data_dir: '{{ nomad_data_dir_win.stat.path | regex_replace("\\", "\\\\") }}'

- name: debug
  ansible.builtin.debug:
    var: nomad_data_dir

- name: Base configuration
  ansible.builtin.template:
    src: base.hcl.j2
    dest: "{{ nomad_config_dir }}/base.hcl"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart nomad

# - name: Create TLS configuration
#   ansible.builtin.include_tasks:
#     file: tls.yml
#   when: nomad_tls_enable | bool

- name: Client configuration
  ansible.builtin.template:
    src: client.hcl.j2
    dest: "{{ nomad_config_dir }}/client.hcl"
    owner: root
    group: root
    mode: "0644"
  when:
    - _nomad_node_client | bool
  notify:
    - Restart nomad

- name: Remove Client configuration
  ansible.builtin.file:
    dest: "{{ nomad_config_dir }}/client.hcl"
    state: absent
  when:
    - nomad_allow_purge_config | bool
    - not _nomad_node_client | bool
  notify:
    - Restart nomad

