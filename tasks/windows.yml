- name: (Windows) Install nomad and create service
  block:
    - name: Convert nomad_binary from Unix -> Windows
      ansible.windows.win_stat:
        path: "{{ nomad_binary }}"
      register: nomad_binary_win

    - name: Convert nomad_config_dir from Unix -> Windows
      ansible.windows.win_stat:
        path: "{{ nomad_config_dir }}"
      register: nomad_config_dir_win

    - name: Create Nomad as a service
      ansible.windows.win_service:
        name: Nomad
        path: "{{ nomad_binary_win.stat.path }} agent -config={{ nomad_config_dir_win.stat.path  }}"
        display_name: Nomad Service
        description: Nomad
        start_mode: auto
        state: started
        
